{% extends '_layout.html' %}{% block main_content %}
<section id="detail">
  <div class="box grid" id="admin-users">
    <ul>
      {% for user in users %}
      <li>
        <a href="{{url_for('user.get_user', user_id=user.id)}}" class="user"
          >{{ user.last_name }}, {{ user.first_name }}</a
        >
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
