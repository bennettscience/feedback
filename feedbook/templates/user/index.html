{% extends '_layout.html' %}{% block main_content %}
<section id="detail">
  <div class="box grid" id="admin-users">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th>Enrolled</th>
          <th>Progress</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>
            <a href="{{url_for('user.get_user', user_id=user.id)}}"
              >{{ user.last_name }}, {{ user.first_name }}</a
            >
          </td>
          <td>{% if user.active %}Active{% else %}Inactive{% endif %}</td>
          <td>
            <a
              href="{{ url_for('course.get_single_course', id=user.enrollments.all()[0].id)}}"
              >{{ user.enrollments.all()[0].name }}</a
            >
          </td>
          <td></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
