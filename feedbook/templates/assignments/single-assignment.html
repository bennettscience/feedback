{% extends "_layout.html" %}{% block main_content %}
<section id="detail">
  <h2>{{ assignment.name }}</h2>
  <h3>Attempts</h3>
  <ul>
    {% for attempt in assignment.assessments.all() %}
    <li>
      {{ attempt.user.last_name }}, {{ attempt.score }}, {{
      attempt.standard.display_name }}
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
